[project]
name = "airpicture"
version = "0.0.1"
description = "Multi-target tracking with an unknown number of aircraft and a biased radar, using sequential RJ-MCMC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flavio R. Avila" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airpicture"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
