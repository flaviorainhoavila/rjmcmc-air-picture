# Benchmark scenario and metric settings.
# Units: metres, seconds, radians. Azimuth is measured counter-clockwise from the +x axis.
# These defaults were chosen at M0; see docs/assumptions.md for the reasoning.

seed: 0

scenario:
  n_scans: 60
  scan_period_s: 5.0
  # Surveillance region (axis-aligned box). Targets that leave it die.
  region_x_m: [-40000.0, 40000.0]
  region_y_m: [20000.0, 100000.0]
  # Nearly-constant-velocity model: continuous white-noise acceleration, PSD per axis.
  process_noise_psd: 1.0          # m^2 / s^3
  initial_targets: 4
  birth_rate: 0.1                 # expected births per scan (Poisson)
  survival_prob: 0.99             # per-scan survival probability inside the region
  speed_range_mps: [150.0, 250.0] # speed of a new target, uniform; heading uniform

  radars:
    A:
      position_m: [-20000.0, 0.0]
      sigma_range_m: 50.0
      sigma_azimuth_rad: 0.001
      range_bias_m: 0.0
      azimuth_bias_rad: 0.0
      detection_prob: 0.9
      clutter_rate: 10.0           # expected false alarms per scan (Poisson)
      fov_range_m: [15000.0, 120000.0]
      fov_azimuth_rad: [0.25, 2.90]
    B:
      position_m: [20000.0, 0.0]
      sigma_range_m: 50.0
      sigma_azimuth_rad: 0.001
      range_bias_m: 300.0          # unknown to the trackers
      azimuth_bias_rad: 0.005      # unknown to the trackers (5 mrad)
      detection_prob: 0.9
      clutter_rate: 10.0
      fov_range_m: [15000.0, 120000.0]
      fov_azimuth_rad: [0.25, 2.90]

metrics:
  ospa_cutoff_m: 1000.0
  ospa_order: 2
  duplicate_gate_m: 1000.0
